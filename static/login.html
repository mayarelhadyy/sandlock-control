<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SandLock Owner Sign In</title><link rel="stylesheet" href="/static/styles.css"></head>
<body class="loginPage"><main class="loginMain"><section class="card loginCard"><img src="/static/assets/mindforge-logo.png" alt="MindForge" class="loginLogo"><small class="eyebrow">SANDLOCK OWNER</small><h1>Welcome back</h1><p>Sign in to manage your SandLock dashboard.</p>
<form id="adminLogin" novalidate><label class="ownerField" for="ownerLogin">Login name<input id="ownerLogin" name="login" autocomplete="username" required aria-describedby="error"></label><label class="ownerField" for="ownerPassword">Password<span class="ownerPasswordWrap"><input id="ownerPassword" name="password" type="password" autocomplete="current-password" required aria-describedby="error"><button class="passwordToggle" id="ownerPasswordToggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><span aria-hidden="true">👁</span></button></span></label><p id="error" role="alert"></p><button class="btn" type="submit">Sign In</button></form><div class="demoDivider"><span>Demo</span></div><button id="demoOwnerLogin" class="btn ghost demoLoginBtn" type="button">Enter Demo Mode</button><p class="demoHint">Local testing only</p></section></main><script src="/static/login.js"></script></body></html>
